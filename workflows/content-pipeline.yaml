name: content-pipeline
description: "Blog content from research to publication"

steps:
  - id: research
    agent: seo@kunde-webshop
    prompt: "Research trending topics for a tech blog article. Identify 3 promising topics with search volume estimates."
    output: research
    timeout: 300

  - id: draft
    agent: dev@kunde-webshop
    prompt: "Write a blog article draft based on the research. Aim for 800-1200 words."
    input: research
    output: draft
    timeout: 600

  - id: optimize
    agent: seo@kunde-webshop
    prompt: "Review the draft and suggest SEO improvements: meta title, meta description, keyword density, and headings structure."
    input: draft
    output: seo_suggestions
    timeout: 300

  - id: finalize
    agent: dev@kunde-webshop
    prompt: "Apply the SEO suggestions to the draft and produce the final article."
    input: seo_suggestions
    output: final
    timeout: 300
