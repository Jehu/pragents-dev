company:
  name: "Meine Agentur"

  agents:
    office:
      type: office
      role: fast  # used by the NL-decomposer to pick the planning model
      model: deepseek/deepseek-v4-flash
      personality: |
        Du bist der Office-Manager einer Agentur. Koordiniere Deadlines,
        Meetings und sorge für unternehmensweite Ordnung.
      memory:
        company: read/write
      capabilities:
        - calendar-management
        - task-tracking

    pm:
      type: pm
      model: deepseek/deepseek-v4-flash
      # PM has cron-driven goals — keep the session warm so each scheduled
      # tick skips the cold-start cost. See `pool.maxWarmSessions` below.
      keepWarm: true
      personality: |
        Du bist der Projekt-Manager. Priorisiere Aufgaben, prüfe
        Ergebnisse und tracke Fortschritt.
      memory:
        company: read/write
        projects:
          all: read
      capabilities:
        - task-prioritization
        - quality-review

  memory:
    short_term:
      max_entries: 100

  # Graduated skill auto-approval (optional).
  # Auto-promotes from quarantine when confidence >= confidenceThreshold
  # AND no blockedTools appear in the skill's allowed-tools list.
  # Omit this section to keep all extracted skills in quarantine for manual review.
  skillApproval:
    confidenceThreshold: 0.9          # 0.0–1.0; default 0.9
    blockedTools:                     # tools that block auto-promotion
      - bash
      - write
      - computer

projects:
  kunde-webshop:
    name: "Kunde Webshop Relaunch"
    directory: "~/demo-projects/kunde-webshop"
    agents:
      dev:
        type: dev
        model: deepseek/deepseek-v4-flash
        personality: |
          Senior Fullstack-Entwickler. Stack: Next.js 14, TypeScript, Prisma, PostgreSQL, Tailwind.
        capabilities:
          - typescript
          - nextjs
          - prisma
          - testing
      seo:
        type: seo
        model: deepseek/deepseek-v4-flash
        capabilities:
          - keyword-research
          - technical-seo

# Example workflow showing onStepFailure: continue.
# Place workflow YAML files in the workflow directory configured for the project.
#
# workflows/parallel-research.yaml:
#
#   name: parallel-research
#   description: |
#     Run multiple research agents in parallel. If one fails, collect partial
#     results and continue — no expensive work is discarded.
#   onStepFailure: continue          # workflow-level default (abort | continue | resume-later)
#   steps:
#     - id: gather
#       onStepFailure: continue      # step-level override (takes precedence over workflow default)
#       parallel:
#         - id: research-seo
#           agent: seo@kunde-webshop
#           prompt: "Research top SEO keywords for the relaunch."
#           output: seo_result
#         - id: research-dev
#           agent: dev@kunde-webshop
#           prompt: "Audit current tech stack and list migration risks."
#           output: dev_result
#     - id: summarize
#       agent: pm@kunde-webshop
#       prompt: |
#         Summarize the gathered research. Partial results (if any step failed) are
#         available as JSON in the template variable {gather.results}.
#       input: gather.results

interfaces:
  web:
    port: 3000
    host: localhost

# Session pool configuration. `maxWarmSessions` caps the number of agents that
# may be marked `keepWarm: true` at once. If more agents request keepWarm than
# this cap allows, the extras stay cold and a warning is logged.
pool:
  maxWarmSessions: 10

costs:
  anthropic/claude-sonnet: { in: 3.0, out: 15.0 }
  anthropic/claude-haiku: { in: 0.8, out: 4.0 }
  anthropic/claude-opus: { in: 15.0, out: 75.0 }
  openai/gpt-4o: { in: 2.5, out: 10.0 }
  openai/gpt-4o-mini: { in: 0.15, out: 0.6 }
  google/gemini-2.5-pro: { in: 1.25, out: 10.0 }
  deepseek/deepseek-v4-flash: { in: 0.14, out: 0.28 }
  deepseek/deepseek-v4-pro: { in: 0.435, out: 0.87 }
